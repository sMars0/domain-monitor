services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: domain-monitor-app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      - postgres

  nginx:
    image: nginx:1.27-alpine
    container_name: domain-monitor-nginx
    ports:
      - "8099:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  postgres:
    image: postgres:14-alpine
    container_name: domain-monitor-postgres
    environment:
      POSTGRES_DB: domain_monitor
      POSTGRES_USER: domain_monitor
      POSTGRES_PASSWORD: domain_monitor_pass
    ports:
      - "5435:5432"
    volumes:
      - domain_monitor_pg:/var/lib/postgresql/data

volumes:
  domain_monitor_pg: