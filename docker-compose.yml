services:
  postgres:
    image: postgres:14-alpine
    container_name: domain-monitor-postgres
    environment:
      POSTGRES_DB: domain_monitor
      POSTGRES_USER: domain_monitor
      POSTGRES_PASSWORD: domain_monitor_pass
    ports:
      - "5435:5432"
    volumes:
      - domain_monitor_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U domain_monitor -d domain_monitor"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  init:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: domain-monitor-init
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    command: >
      bash -lc "
        composer install --no-interaction --prefer-dist --optimize-autoloader &&
        npm install &&
        npm run build &&
        mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/testing storage/framework/views storage/logs bootstrap/cache &&
        chmod -R ug+rwX storage bootstrap/cache &&
        php artisan key:generate --force &&
        php artisan storage:link || true &&
        php artisan migrate --force &&
        php artisan optimize:clear &&
        php artisan config:cache &&
        php artisan route:cache &&
        php artisan view:cache
      "
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: domain-monitor-app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: domain-monitor-nginx
    ports:
      - "8099:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    restart: unless-stopped

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: domain-monitor-queue
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=60
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: domain-monitor-scheduler
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    command: php artisan schedule:work
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  domain_monitor_pg: